# SQLite database for the single-machine desktop deployment.
#
# Rails 8 runs primary + Solid Cache/Queue/Cable on independent SQLite files.
# In production the data directory is resolved at runtime from MULTICARNES_DATA_DIR
# (set by the Windows launcher, e.g. %LOCALAPPDATA%\Multicarnes\data). In
# development/test the files live under the project's storage/ folder.
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and re-generated from
# your development database when you run "rake". Do not set this db to the same
# as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production: a single offline Windows machine. The launcher exports
# MULTICARNES_DATA_DIR pointing at a writable, update-safe user folder.
<% data_dir = ENV.fetch("MULTICARNES_DATA_DIR") { Rails.root.join("storage").to_s } %>
production:
  primary:
    <<: *default
    database: <%= File.join(data_dir, "production.sqlite3") %>
  cache:
    <<: *default
    database: <%= File.join(data_dir, "production_cache.sqlite3") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= File.join(data_dir, "production_queue.sqlite3") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= File.join(data_dir, "production_cable.sqlite3") %>
    migrations_paths: db/cable_migrate
